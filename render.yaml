services:
  - type: web
    name: library-management-api
    runtime: node
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: DEFAULT_LOAN_DAYS
        value: 14
      - key: FINE_PER_DAY
        value: 5
      - key: GEMINI_API_KEY
        sync: false
